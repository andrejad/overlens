# Overlens settings. This file comes ready with the download: start the program and it works.
# One `key: value` per line; lines starting with # are comments. Changes need a restart.
# Relative paths below are relative to this file's folder, so everything Overlens writes stays in
# the overlens-data folder beside the program. Any key can also be set by an environment variable:
# OVERLENS_ + the key in capitals, e.g. OVERLENS_PORT=9000.

# The first admin, created on the first start only (when there are no users yet).
# Log in with it and change the password right away (account menu); changing these lines later does nothing.
bootstrap_admin_user: admin
bootstrap_admin_password: admin

# The port of the address in your browser: http://localhost:8080
port: 8080

# The database, the log files and the daily backups. Their folders are created when missing.
db_path: ./overlens-data/db/overlens-database.db
log_dir: ./overlens-data/logs
backup_dir: ./overlens-data/backups

# How much the log tells: DEBUG, INFO, WARN or ERROR.
log_level: INFO

# A daily backup of the database, made by the program itself: on/off, the time of day (24-hour, this
# computer's time) and how many daily backups to keep. If the program was off at that time, it makes the
# day's backup when it next starts.
backup_enabled: true
backup_time: 04:00
backup_keep_days: 10

# Audit log entries older than this many days are removed once a day (0 keeps them forever).
audit_retention_days: 365

# How long a login lasts, in days (extended while you keep using Overlens).
session_ttl_days: 365

# On the very first start, add a small sample company so the screens are not empty. It happens once;
# delete it whenever you like.
sample_data: true

# The read-only connection for AI assistants (MCP) at /mcp. It shows only what anyone who can open
# Overlens can see, and it changes nothing. false switches it off.
mcp_enabled: true

# production for real use. (development only unlocks a loader for the developers' test data.)
environment: production

# The login cookie's Secure flag: auto (Secure only over HTTPS) or true (always; for an HTTPS proxy in front).
cookie_secure: auto
